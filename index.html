<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medidor de resistencias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
  :root {
    --fondo: #E6ECF0;
    --panel: #F7F9FA;
    --tinta: #1D2A36;
    --suave: #5E6E7C;
    --linea: #C9D3DA;
    --nivel: #1F9E89;
    --carga: #E3A21A;
    --bajo: #C8412F;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #16202A; --panel: #1E2B37; --tinta: #E4EAEE;
      --suave: #93A3B1; --linea: #33434F;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--fondo); color: var(--tinta);
    font: 400 1rem/1.5 "Barlow", system-ui, sans-serif;
    display: grid; place-items: center; padding: 2rem 1rem;
  }
  main { width: 100%; max-width: 820px; }
  h1 { font: 700 2.2rem/1.1 "Barlow Condensed", sans-serif; margin: 0 0 .25rem; }
  .estado-conexion { color: var(--suave); margin: 0 0 2rem; font-size: .95rem; }
  .estado-conexion b { font-weight: 600; }

  .contenido { display: grid; grid-template-columns: 240px 1fr; gap: 2.5rem; align-items: center; }
  @media (max-width: 640px) { .contenido { grid-template-columns: 1fr; justify-items: center; } }

  /* La celda: el elemento protagonista */
  .celda { position: relative; width: 150px; height: 280px; margin: 0 auto; }
  .celda::before {
    content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 50px; height: 16px; background: var(--tinta); border-radius: 4px 4px 0 0;
  }
  .cuerpo {
    position: absolute; top: 16px; inset-inline: 0; bottom: 0;
    border: 5px solid var(--tinta); border-radius: 14px; overflow: hidden; background: var(--panel);
  }
  .relleno {
    position: absolute; bottom: 0; left: 0; right: 0; height: 0%;
    background: var(--nivel); transition: height .8s ease, background-color .4s;
  }
  .celda.cargando .relleno { background: var(--carga); }
  .celda.bajo .relleno { background: var(--bajo); }
  .pct {
    position: absolute; inset: 16px 0 0; display: grid; place-items: center;
    font: 700 3.2rem/1 "Barlow Condensed", sans-serif; mix-blend-mode: difference; color: #fff;
  }
  .rayo {
    position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
    width: 28px; opacity: 0; transition: opacity .3s;
  }
  .celda.cargando .rayo { opacity: 1; animation: pulso 1.6s ease-in-out infinite; }
  @keyframes pulso { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) {
    .relleno { transition: none; } .celda.cargando .rayo { animation: none; }
  }

  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: .9rem 1.5rem; }
  dt { color: var(--suave); }
  dd { margin: 0; font: 500 1.6rem/1.1 "Barlow Condensed", sans-serif; }
  #estado.cargando { color: var(--carga); }

  .historial { margin-top: 2rem; }

  /* Lectura principal: la resistencia bajo prueba */
  .medida {
    background: var(--panel); border: 1px solid var(--linea); border-radius: 12px;
    padding: 1.4rem 1.6rem; margin-bottom: 2.2rem;
    display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .5rem 1.5rem;
  }
  .medida .etiqueta { width: 100%; color: var(--suave); font-size: .95rem; }
  .medida .valor { font: 700 clamp(3rem, 12vw, 4.6rem)/1 "Barlow Condensed", sans-serif; font-variant-numeric: tabular-nums; }
  .medida .valor small { font-size: .45em; font-weight: 500; margin-left: .15em; color: var(--suave); }
  .medida .aviso { font: 600 1.05rem "Barlow", sans-serif; color: var(--nivel); }
  .medida.fuera .valor, .medida.fuera .aviso { color: var(--carga); }
  .medida.abierta .valor { color: var(--suave); }
  .medida.abierta .aviso { color: var(--bajo); }
  .seccion { font: 700 1.3rem/1.2 "Barlow Condensed", sans-serif; margin: 0 0 1rem; color: var(--suave); text-transform: uppercase; letter-spacing: .04em; }
  .historial p { color: var(--suave); margin: 0 0 .5rem; font-size: .95rem; }
  svg.grafica { width: 100%; height: 120px; display: block; border-bottom: 1px solid var(--linea); }

  form { margin-top: 2rem; display: flex; gap: .5rem; flex-wrap: wrap; }
  label { width: 100%; color: var(--suave); font-size: .95rem; }
  input {
    flex: 1; min-width: 220px; padding: .55rem .7rem; font: inherit; color: var(--tinta);
    background: var(--panel); border: 1px solid var(--linea); border-radius: 6px;
  }
  button {
    padding: .55rem 1.1rem; font: 600 1rem "Barlow", sans-serif; cursor: pointer;
    color: var(--panel); background: var(--tinta); border: 0; border-radius: 6px;
  }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--nivel); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Medidor de resistencias</h1>
  <p class="estado-conexion" id="conexion">Conectando al broker…</p>

  <section class="medida" id="medida" aria-live="polite">
    <span class="etiqueta">Resistencia bajo prueba (rango 0 a 1 Ω)</span>
    <span class="valor" id="rx">--</span>
    <span class="aviso" id="rxEstado">Esperando medición</span>
  </section>

  <h2 class="seccion">Batería del equipo</h2>
  <div class="contenido">
    <div class="celda" id="celda" aria-label="Nivel de carga">
      <div class="cuerpo"><div class="relleno" id="relleno"></div></div>
      <svg class="rayo" viewBox="0 0 24 36" aria-hidden="true"><path d="M14 0 0 21h9l-3 15 18-22h-10z" fill="#fff"/></svg>
      <div class="pct" id="pct">--%</div>
    </div>

    <div>
      <dl>
        <dt>Voltaje</dt><dd id="voltaje">-- V</dd>
        <dt>Estado</dt><dd id="estado">Sin datos</dd>
        <dt>Tiempo para carga completa</dt><dd id="tiempo">--</dd>
        <dt>Última lectura</dt><dd id="hora">--</dd>
      </dl>
    </div>
  </div>

  <section class="historial">
    <p>Voltaje de los últimos 60 segundos (3.0 V a 4.2 V)</p>
    <svg class="grafica" viewBox="0 0 600 120" preserveAspectRatio="none">
      <polyline id="linea" fill="none" stroke="var(--nivel)" stroke-width="2.5" vector-effect="non-scaling-stroke" points=""/>
    </svg>
  </section>

  <form id="form">
    <label for="topico">Tópico MQTT (debe ser igual al del ESP32)</label>
    <input id="topico" value="bateria/esp32-demo-7391/datos">
    <button type="submit">Cambiar tópico</button>
  </form>
</main>

<script>
  const BROKER = "wss://broker.hivemq.com:8884/mqtt";
  const $ = id => document.getElementById(id);
  const historial = [];
  let topicoActual = $("topico").value;

  const cliente = mqtt.connect(BROKER, { clientId: "web-" + Math.random().toString(16).slice(2, 8) });

  cliente.on("connect", () => {
    $("conexion").innerHTML = "Conectado a <b>broker.hivemq.com</b>, esperando datos del ESP32…";
    cliente.subscribe(topicoActual);
  });
  cliente.on("reconnect", () => $("conexion").textContent = "Reconectando al broker…");
  cliente.on("error", e => $("conexion").textContent = "Error de conexión: " + e.message);

  cliente.on("message", (topico, mensaje) => {
    let d;
    try { d = JSON.parse(mensaje.toString()); } catch { return; }
    mostrar(d);
  });

  function mostrarResistencia(d) {
    if (typeof d.resistencia !== "number") return;
    const caja = $("medida");
    caja.classList.toggle("fuera", d.rx_estado === "FUERA DE RANGO");
    caja.classList.toggle("abierta", d.rx_estado === "SIN RESISTENCIA");

    if (d.rx_estado === "SIN RESISTENCIA") {
      $("rx").textContent = "--";
      $("rxEstado").textContent = "Conecta una resistencia";
      return;
    }
    // Menos de 0.1 Ω se muestra en miliohmios para conservar la resolución
    $("rx").innerHTML = d.resistencia < 0.1
      ? (d.resistencia * 1000).toFixed(1) + "<small>mΩ</small>"
      : d.resistencia.toFixed(4) + "<small>Ω</small>";
    $("rxEstado").textContent = d.rx_estado === "FUERA DE RANGO" ? "Fuera de rango (> 1 Ω)" : "Medición válida";
  }

  function mostrar(d) {
    $("conexion").innerHTML = "Recibiendo datos en <b>" + topicoActual + "</b>";
    $("pct").textContent = Math.round(d.porcentaje) + "%";
    $("relleno").style.height = d.porcentaje + "%";
    $("voltaje").textContent = d.voltaje.toFixed(2) + " V";

    const celda = $("celda");
    celda.classList.toggle("cargando", d.cargando);
    celda.classList.toggle("bajo", !d.cargando && d.porcentaje < 20);

    const textos = { "CARGANDO": "Cargando", "CARGA COMPLETA": "Carga completa", "DESCARGANDO": "Descargando" };
    $("estado").textContent = textos[d.estado] || (d.cargando ? "Cargando" : "Descargando");
    $("estado").className = d.cargando ? "cargando" : "";

    mostrarResistencia(d);

    if (d.cargando) {
      const h = Math.floor(d.tiempo_h), m = Math.round((d.tiempo_h - h) * 60);
      $("tiempo").textContent = d.porcentaje >= 100 ? "Completa" : `${h} h ${m} min`;
    } else {
      $("tiempo").textContent = "No está cargando";
    }
    $("hora").textContent = new Date().toLocaleTimeString();

    historial.push(d.voltaje);
    if (historial.length > 60) historial.shift();
    const pts = historial.map((v, i) => {
      const x = (i / 59) * 600;
      const y = 120 - ((Math.min(Math.max(v, 3), 4.2) - 3) / 1.2) * 110 - 5;
      return x.toFixed(1) + "," + y.toFixed(1);
    }).join(" ");
    $("linea").setAttribute("points", pts);
  }

  $("form").addEventListener("submit", e => {
    e.preventDefault();
    const nuevo = $("topico").value.trim();
    if (!nuevo || nuevo === topicoActual) return;
    cliente.unsubscribe(topicoActual);
    topicoActual = nuevo;
    cliente.subscribe(topicoActual);
    historial.length = 0;
    $("conexion").innerHTML = "Suscrito a <b>" + topicoActual + "</b>, esperando datos…";
  });
</script>
</body>
</html>
